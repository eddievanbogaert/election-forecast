<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- Bar chart visualization -->
  <g transform="translate(680, 160)">
    <!-- D bars -->
    <rect x="0" y="120" width="48" height="200" rx="4" fill="#3b82f6" opacity="0.5"/>
    <rect x="60" y="60" width="48" height="260" rx="4" fill="#3b82f6" opacity="0.65"/>
    <rect x="120" y="20" width="48" height="300" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="180" y="0" width="48" height="320" rx="4" fill="#3b82f6"/>

    <!-- R bars -->
    <rect x="260" y="10" width="48" height="310" rx="4" fill="#ef4444"/>
    <rect x="320" y="40" width="48" height="280" rx="4" fill="#ef4444" opacity="0.8"/>
    <rect x="380" y="90" width="48" height="230" rx="4" fill="#ef4444" opacity="0.65"/>
    <rect x="440" y="140" width="48" height="180" rx="4" fill="#ef4444" opacity="0.5"/>

    <!-- Majority line -->
    <line x1="-20" y1="160" x2="508" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="516" y="165" font-family="system-ui,sans-serif" font-size="16" fill="#94a3b8">51</text>
  </g>

  <!-- Title text -->
  <text x="80" y="240" font-family="system-ui,sans-serif" font-size="72" font-weight="700" fill="#60a5fa">2026</text>
  <text x="80" y="320" font-family="system-ui,sans-serif" font-size="64" font-weight="700" fill="#f1f5f9">Senate</text>
  <text x="80" y="400" font-family="system-ui,sans-serif" font-size="64" font-weight="700" fill="#f1f5f9">Forecast</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="system-ui,sans-serif" font-size="22" fill="#94a3b8">Monte Carlo simulation model</text>

  <!-- Badge -->
  <rect x="80" y="475" width="130" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="145" y="496" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#64748b">MIDTERMS</text>
</svg>
